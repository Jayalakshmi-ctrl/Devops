name: ACEest Gym Automated CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Compilation Validation
      run: python -m compileall app/ run.py

    - name: Run Pytest Quality Assertions
      run: |
        export PYTHONPATH=.
        pytest --verbose

    - name: Docker Container Assembly
      run: docker build -t gym-app-v2:latest .
